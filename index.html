<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>La Labora Mariscos — PWA de ventas</title>

  <!-- PWA instalable -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0e6b5c">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">

  <link rel="stylesheet" href="css/estilos.css">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
</head>

<body>

  <header class="appbar">
    <div class="logo">
      <img src="img/logo.png" alt="La Labora" loading="lazy">
    </div>
    <div>
      <h1>La Labora Mariscos</h1>
      <p class="giro">Mariscos y ceviches</p>
    </div>
    <!-- estado conexión -->
    <span id="estado-conexion" class="pill">conectado</span>
  </header>

  <main>
    <!-- ---- Sección 1: Catálogo (CSR) ---- -->
    <section>
      <h2>Catálogo</h2>

      <div id="catalogo" class="grid">
        <p>Cargando catálogo…</p>
      </div>
    </section>

    <!-- ---- Sección 2: Carrito (carrito.js lo llena y lo guarda en localStorage) ---- -->
    <section>
      <h2>Carrito</h2>
      <ul id="carrito-lista"></ul>
      <p>Total: $<span id="carrito-total">0</span></p>
      <button id="btn-sincronizar" type="button">Sincronizar carrito</button>
      <p id="carrito-mensaje" class="mensaje"></p>
    </section>

    <!-- ---- Info de contacto (abajo de todo) ---- -->
    <section class="info-contacto">
      <p><strong>Horario:</strong> Martes a domingo 12:00pm - 8:00pm</p>
      <p><strong>Ubicación:</strong> Hermosillo, Sonora</p>
      <p><strong>Redes:</strong> @lalaboramariscos (Facebook e Instagram)</p>
    </section>
  </main>

  <script src="js/carrito.js"></script>
  <script src="js/csr.js"></script>
  <script src="js/notificaciones.js"></script>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script src="js/geolocalizacion.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
